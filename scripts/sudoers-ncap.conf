# Allow the NCAP service account to manage its own units without a password.
# This is what makes the "Update now" / "Restart services" buttons in the admin
# panel work.  Installed to /etc/sudoers.d/ncap-checker with mode 0440.
#
# Nothing else is granted: only start/stop/restart/status of the two NCAP units.

ncap ALL=(root) NOPASSWD: /bin/systemctl start ncap-web, /bin/systemctl stop ncap-web, /bin/systemctl restart ncap-web, /bin/systemctl status ncap-web
ncap ALL=(root) NOPASSWD: /bin/systemctl start ncap-scheduler, /bin/systemctl stop ncap-scheduler, /bin/systemctl restart ncap-scheduler, /bin/systemctl status ncap-scheduler
ncap ALL=(root) NOPASSWD: /bin/systemctl restart ncap-web ncap-scheduler
