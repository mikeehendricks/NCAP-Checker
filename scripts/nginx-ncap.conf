# NCAP Checker - nginx reverse proxy
# Installed to /etc/nginx/sites-available/ncap-checker (symlinked into sites-enabled)
#
# Replace `server_name _;` with your hostname, then (optionally) issue a
# certificate with:  sudo certbot --nginx -d your.host.name

upstream ncap_checker {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 8m;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/ncap-checker.access.log;
    error_log  /var/log/nginx/ncap-checker.error.log;

    location /static/ {
        alias /opt/ncap-checker/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://ncap_checker;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_redirect off;
    }
}
